services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: arveluna_payments
      MYSQL_USER: arveluna
      MYSQL_PASSWORD: arveluna
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: ["payments-data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  payments-data:
