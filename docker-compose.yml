services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: arveluna_payments
      MYSQL_USER: arveluna
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env con npm run env:init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env con npm run env:init}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["payments-data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  payments-data:
